name: Release CLI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag/version to package for manual artifact builds; manual runs do not publish."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runs-on: macos-15
            asset-platform: macos
            asset-arch: arm64
            build-arch: arm64
          - name: macos-x86_64
            runs-on: macos-15-intel
            asset-platform: macos
            asset-arch: x86_64
            build-arch: x86_64
    runs-on: ${{ matrix.runs-on }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.3 or 26.2
        run: |
          set -euo pipefail
          # Both versions are part of the official macOS 15 runner image.
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "${candidate}/Contents/Developer"
              echo "DEVELOPER_DIR=${candidate}/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          [[ "$(/usr/bin/xcodebuild -version)" == Xcode\ 26.* ]]
          /usr/bin/xcodebuild -version

      - name: Runner info
        run: |
          set -euo pipefail
          uname -a
          uname -m
          swift --version

      - name: Validate release tag
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Missing release tag." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Build CodexBarCLI (release)
        id: build
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ARGS=(swift build -c release --product CodexBarCLI)
          BUILD_ARGS+=(--arch "${{ matrix.build-arch }}")
          "${BUILD_ARGS[@]}"

          SHOW_BIN_ARGS=(swift build -c release --product CodexBarCLI --show-bin-path)
          SHOW_BIN_ARGS+=(--arch "${{ matrix.build-arch }}")

          echo "bin_dir=$("${SHOW_BIN_ARGS[@]}")" >> "$GITHUB_OUTPUT"

      - name: Smoke test CodexBarCLI
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail

          BIN_DIR="${{ steps.build.outputs.bin_dir }}"
          BIN="$BIN_DIR/CodexBarCLI"
          run_with_timeout() {
            local output="$1"
            shift
            "$@" > "$output" &
            local pid=$!
            local run_status=
            for _ in {1..20}; do
              if ! kill -0 "$pid" 2>/dev/null; then
                set +e
                wait "$pid"
                run_status=$?
                set -e
                break
              fi
              sleep 1
            done
            if [[ -z "$run_status" ]]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              echo "$* timed out." >&2
              exit 124
            fi
            if [[ "$run_status" -ne 0 ]]; then
              cat "$output" >&2 || true
              exit "$run_status"
            fi
          }

          echo "BIN=$BIN"
          file "$BIN"
          lipo -archs "$BIN" | tr ' ' '\n' | grep -Fx "${{ matrix.asset-arch }}"
          run_with_timeout "$RUNNER_TEMP/codexbar-cli-smoke-${{ matrix.name }}.txt" "$BIN" config validate --format json
          printf '%s\n' "${RELEASE_TAG#v}" > "$BIN_DIR/VERSION"
          VERSION_OUTPUT="$RUNNER_TEMP/codexbar-cli-version-${{ matrix.name }}.txt"
          run_with_timeout "$VERSION_OUTPUT" "$BIN" --version
          grep -Fx "CodexBar ${RELEASE_TAG#v}" "$VERSION_OUTPUT"
          rm "$BIN_DIR/VERSION"

      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail

          REF_NAME="${RELEASE_TAG}"
          if [[ -z "$REF_NAME" ]]; then
            echo "Missing release tag." >&2
            exit 1
          fi
          SAFE_REF_NAME="${REF_NAME//\//-}"

          BIN_DIR="${{ steps.build.outputs.bin_dir }}"
          OUT_DIR="$(mktemp -d)"
          install -m 0755 "$BIN_DIR/CodexBarCLI" "$OUT_DIR/CodexBarCLI"
          ln -s "CodexBarCLI" "$OUT_DIR/codexbar"
          printf '%s\n' "${SAFE_REF_NAME#v}" > "$OUT_DIR/VERSION"
          python3 Scripts/acknowledgements.py --text-output "$OUT_DIR/THIRD_PARTY_NOTICES"

          CORE_RESOURCE_SOURCE=""
          for candidate in \
            "$BIN_DIR/CodexBar_CodexBarCore.bundle" \
            "$BIN_DIR/CodexBar_CodexBarCore.resources"; do
            if [[ -d "$candidate" ]]; then
              CORE_RESOURCE_SOURCE="$candidate"
              break
            fi
          done
          if [[ -z "$CORE_RESOURCE_SOURCE" ]]; then
            echo "Missing CodexBarCore resource bundle in $BIN_DIR" >&2
            exit 1
          fi
          cp -R "$CORE_RESOURCE_SOURCE" "$OUT_DIR/CodexBar_CodexBarCore.bundle"
          DIRECT_RESOURCE_SMOKE_OUTPUT="$RUNNER_TEMP/codexbar-cli-resource-smoke-direct-${{ matrix.name }}.txt"
          CODEXBAR_RESOURCE_SMOKE=1 "$OUT_DIR/CodexBarCLI" > "$DIRECT_RESOURCE_SMOKE_OUTPUT"
          grep -Fx "CODEXBAR_RESOURCE_SMOKE_OK" "$DIRECT_RESOURCE_SMOKE_OUTPUT"
          SYMLINK_RESOURCE_SMOKE_OUTPUT="$RUNNER_TEMP/codexbar-cli-resource-smoke-symlink-${{ matrix.name }}.txt"
          CODEXBAR_RESOURCE_SMOKE=1 "$OUT_DIR/codexbar" > "$SYMLINK_RESOURCE_SMOKE_OUTPUT"
          grep -Fx "CODEXBAR_RESOURCE_SMOKE_OK" "$SYMLINK_RESOURCE_SMOKE_OUTPUT"

          ASSET="CodexBarCLI-${SAFE_REF_NAME}-${{ matrix.asset-platform }}-${{ matrix.asset-arch }}.tar.gz"
          (cd "$OUT_DIR" && tar czf "$ASSET" \
            CodexBarCLI codexbar VERSION THIRD_PARTY_NOTICES CodexBar_CodexBarCore.bundle)
          Scripts/generate_release_checksum.sh "$OUT_DIR/$ASSET"

          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          OUT_DIR="${{ steps.pkg.outputs.out_dir }}"
          ASSET="${{ steps.pkg.outputs.asset }}"
          gh release upload "$TAG" "$OUT_DIR/$ASSET" "$OUT_DIR/$ASSET.sha256" --clobber

      - name: Upload workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codexbar-cli-${{ matrix.name }}
          path: |
            ${{ steps.pkg.outputs.out_dir }}/${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.out_dir }}/${{ steps.pkg.outputs.asset }}.sha256

  update-homebrew-tap:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    needs: build-cli
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ -z "$tag" ]]; then
            echo "Missing release tag." >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "request_id=codexbar-${tag}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Dispatch tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REQUEST_ID: ${{ steps.release.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          for attempt in {1..6}; do
            if gh workflow run update-formula.yml \
              --repo steipete/homebrew-tap \
              --ref main \
              -f formula=codexbar \
              -f tag="$RELEASE_TAG" \
              -f repository=steipete/CodexBar \
              -f artifact_template='CodexBarCLI-{tag}-{target}.tar.gz' \
              -f target_aliases='darwin_arm64=macos-arm64,darwin_amd64=macos-x86_64' \
              -f cask=codexbar \
              -f cask_artifact='CodexBar-macos-universal-{version}.zip' \
              -f request_id="$REQUEST_ID"; then
              exit 0
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo "Failed to dispatch tap update after ${attempt} attempts." >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Wait for tap update
        timeout-minutes: 70
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REQUEST_ID: ${{ steps.release.outputs.request_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TAP_WAIT_TIMEOUT_SECONDS: "3900"
        shell: bash
        run: ./Scripts/wait_for_homebrew_tap_update.sh
